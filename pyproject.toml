[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logsentinel"
version = "1.3.1"
description = "Lightweight suspicious activity and log analyzer"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
logsentry = "logsentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[project.optional-dependencies]
dev = ["pytest"]